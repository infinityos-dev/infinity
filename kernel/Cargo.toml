[package]
name = "hexium_os"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
acpic = { package = "acpi", version = "5.2.0" }
conquer-once = { version = "0.2.0", default-features = false }
crossbeam-queue = { version = "0.3.11", default-features = false, features = [
    "alloc",
] }
flanterm = "0.0.2"
futures-util = { version = "0.3.4", default-features = false, features = [
    "alloc",
] }
lazy_static = { version = "1.0", features = ["spin_no_std"] }
limine = "0.4"
linked_list_allocator = "0.9.0"
nodit = "0.9.2"
pc-keyboard = "0.7.0"
raw-cpuid = "11.5.0"
spin = "0.9.8"
talc = "4.4.2"
uart_16550 = "0.3.2"
x2apic = "0.5.0"
x86_64c = { package = "x86_64", version = "0.14.2" }

[features]
testing = []

[[test]]
name = "should_panic"
harness = false
